apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shopkart-dev
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: shopkart-ecommerce
    app.kubernetes.io/component: frontend-ui
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
