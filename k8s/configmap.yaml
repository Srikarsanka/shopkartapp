apiVersion: v1
kind: ConfigMap
metadata:
  name: shopkart-config
  namespace: shopkart-dev
  labels:
    app.kubernetes.io/name: shopkart
    app.kubernetes.io/part-of: shopkart-ecommerce
    app.kubernetes.io/component: configuration
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOST: "0.0.0.0"
  CORS_ORIGIN: "*"
  SERVICE_NAME: "shopkart-backend"
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "info"
